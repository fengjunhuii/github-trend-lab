name: daily-collect

on:
  schedule:
    - cron: "17 2 * * *" # UTC 02:17，避开整点高峰；Actions 可能延迟数分钟
  workflow_dispatch:
    inputs:
      collect_date:
        description: "补采日期 YYYY-MM-DD（留空 = 今天 UTC）"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Run collector
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          COLLECT_DATE: ${{ github.event.inputs.collect_date }}
        run: |
          if [ -n "$COLLECT_DATE" ]; then
            python -m collector run --date "$COLLECT_DATE"
          else
            python -m collector run
          fi

      - name: Commit data & report
        run: |
          git config user.name "trend-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data reports
          if git diff --cached --quiet; then
            echo "无数据变更，跳过提交"
          else
            git commit -m "data: $(date -u +%F)"
            git push
          fi

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const d = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[data] 每日采集失败 ${d}`,
              body: `请检查运行日志: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
