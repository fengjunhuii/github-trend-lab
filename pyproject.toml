[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "github-trend-lab"
version = "0.1.0"
description = "Daily collector and analyzer for GitHub trending and high-star repositories (2026 new stars)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "click>=8.1",
    "beautifulsoup4>=4.12",
    "duckdb>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["collector", "analysis", "report"]

[tool.pytest.ini_options]
testpaths = ["tests"]
